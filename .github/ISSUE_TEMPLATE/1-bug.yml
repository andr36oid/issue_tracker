name: Something doesn't work
description: A problem on an R36S, R36S Plus, R46H, R50S, D-28S, G350 or R45H with andr36oid.
title: '[Console]: what doesn''t work'
labels:
- bug
- needs triage
body:
- type: markdown
  attributes:
    value: |-
      Thanks for taking the time to report this. This tracker is for the **R36S, R36S Plus, R46H, R50S, D-28S, G350 and R45H** with the files from the `Panels` or `Devices` folders.

      Using a folder from `Experimental` (R36S clones, K36, G80, R36 Max, Soy Sauce and others)? Report it in the [clone issue tracker](https://github.com/andr36oid/clone_issue_tracker/issues/new/choose) instead.

      If you don't know an answer, choose or write "Don't know". You can write in English, Spanish or Portuguese.

      **Before you report:** some known problems (no speaker sound, saves that don't stick, a few others) already have a ready-made fix in the **hotfixes repo** that you drop onto the BOOT drive, no new build needed: **https://github.com/andr36oid/hotfixes** (the SD Flasher can also install these for you). If a fix matches your problem, try it first.
- type: dropdown
  id: console
  attributes:
    label: Which console?
    options:
    - R36S
    - R36S Plus
    - R46H
    - R50S
    - D-28S
    - G350
    - R45H
    - Don't know
  validations:
    required: true
- type: dropdown
  id: folder
  attributes:
    label: Which folder's files are on the BOOT drive?
    description: The one you chose in the flasher, or copied by hand. `dtb-hint.txt` on the BOOT drive says it in its first line ("Now in use").
    options:
    - Panels/Panel0 (R36S, panel 0)
    - Panels/Panel1 (R36S, panel 1)
    - Panels/Panel2 (R36S, panel 2)
    - Panels/Panel3 (R36S, panel 3)
    - Panels/Panel4 (R36S, panel 4 (the default))
    - Panels/Panel5 (R36S, panel 5)
    - Panels/Panel6 (R36S, panel 6)
    - Panels/R36S-Plus (R36S Plus, 720×720)
    - Devices/R46H (R46H)
    - Devices/R50S (R50S)
    - Devices/D-28S (Diium D-28S)
    - Devices/G350 (BatleXP G350)
    - Devices/R45H (R45H / HL-R36H ProMax)
    - The files the card came with (I didn't change anything)
    - Don't know
  validations:
    required: true
- type: input
  id: version
  attributes:
    label: Which andr36oid version?
    description: Settings > About console shows it, or use the name of the file you wrote to the card.
    placeholder: 'For example: andr36oid-20261024-1750-rk3326'
  validations:
    required: true
- type: dropdown
  id: area
  attributes:
    label: What is the problem about?
    description: Pick the closest.
    options:
    - Starting up / the console doesn't start
    - Screen
    - Buttons or sticks
    - Sound
    - Battery, charging or sleep
    - Wi-Fi or Bluetooth
    - Games or emulators
    - Apps or the launcher
    - Settings
    - SD card or storage
    - Installing andr36oid / the SD Flasher
    - Kernel Tweaks (Settings > System > Kernel Tweaks)
    - Something else
  validations:
    required: true
- type: textarea
  id: what
  attributes:
    label: What happens?
    description: What did you do, what did you expect, and what happened instead?
    placeholder: |-
      1. I open …
      2. I press …
      3. The console …
  validations:
    required: true
- type: dropdown
  id: often
  attributes:
    label: How often does it happen?
    options:
    - Every time
    - Often
    - Sometimes
    - It happened once
    - Don't know
  validations:
    required: true
- type: input
  id: since
  attributes:
    label: Since when?
    description: Did it start after an update, a setting you changed or an app you installed? Did an older version work?
    placeholder: 'For example: since the 20261011 build; worked before'
  validations:
    required: false
- type: markdown
  attributes:
    value: |-
      ## Kernel Tweaks

      **Settings > System > Kernel Tweaks** changes low-level settings (sleep, processor, memory, SD cards, controls, logs). Options under **At start (needs a restart)** are saved in **`kernel-tweaks.txt`** on the BOOT drive and only take effect after a restart.

      If you changed something there, try once with the **Use tweaks** switch off (or **Reset everything**) and say below whether the problem goes away. If the console no longer starts after changing a start option, delete `kernel-tweaks.txt` from the BOOT drive on a computer: it then starts without them.

      The problem report lists every tweak that isn't at its default, so you don't need to copy them by hand.
- type: dropdown
  id: tweaks
  attributes:
    label: Did you change anything in Kernel Tweaks?
    options:
    - No, everything is at the default
    - Yes, and the problem goes away with "Use tweaks" off
    - Yes, and the problem stays with "Use tweaks" off
    - Yes, but I didn't try with them off
    - They switched themselves off ("didn't finish starting twice in a row")
    - My version has no Kernel Tweaks
    - Don't know
  validations:
    required: true
- type: textarea
  id: tweaks_changed
  attributes:
    label: Which tweaks did you change? (optional)
    description: Only needed if you couldn't make a problem report. Name the setting and the value, e.g. "Sleep type → Light sleep". If the console doesn't start, open `kernel-tweaks.txt` on the BOOT drive with Notepad and copy its `kt_args=` line here.
    placeholder: |-
      Sleep type → Light sleep
      kt_args=fiq_debugger.disable=0 console=ttyS2,115200n8 …
  validations:
    required: false
- type: textarea
  id: media
  attributes:
    label: Screenshots or video (optional)
    description: Drag them here. A photo of the screen taken with a phone is fine. For a video, upload it to YouTube or Google Drive and paste the link.
  validations:
    required: false
- type: markdown
  attributes:
    value: |-
      ## Problem report

      A problem report helps a lot: it holds the logs from now and from the last start.

      **If the console works:** right after the problem, open **Settings > System > Problem report**, describe what went wrong and tap **Save report**. It is saved on the **EASYROMS** drive, in the folder `andr36oid-reports`.

      **If the console doesn't start or the screen stays black:**
      1. Put the SD card into a computer and open the drive called **BOOT**.
      2. Make a new, empty text file at the top of that drive called **`make-report.txt`** (Windows: right-click → **New** → **Text Document**). If Windows hides file endings, just name it `make-report`.
      3. Put the card into the console, switch it on and **wait 10 minutes**, even if the screen stays black. Then switch it off (hold the power button for about 10 seconds if it doesn't react).
      4. Put the card into the computer again. The report is in `andr36oid-reports` on BOOT or EASYROMS; **`make-report-result.txt`** on BOOT says where.

      The report lists your apps and Kernel Tweaks and can contain Wi-Fi network names. Have a look before you post it.
- type: textarea
  id: report
  attributes:
    label: Problem report (.zip)
    description: Drag the `report-….zip` file here, or write why you couldn't make one.
  validations:
    required: false
- type: textarea
  id: other
  attributes:
    label: Anything else?
    description: Accessories plugged in (controller, headphones, USB stick), SD card brand and size, anything that seems related.
  validations:
    required: false
- type: checkboxes
  id: hotfix_checked
  attributes:
    label: Before you post
    options:
    - label: I checked the hotfixes repo (github.com/andr36oid/hotfixes) in case a ready-made fix already covers this.
